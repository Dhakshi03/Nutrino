<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" fill="none">
  <defs>
    <!-- Soft 3D Outer Skin Gradient -->
    <radialGradient id="avocadoSkin3D" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#48B273" />
      <stop offset="55%" stop-color="#2E8B57" />
      <stop offset="100%" stop-color="#174B35" />
    </radialGradient>
    <!-- Soft 3D Inner Flesh Gradient -->
    <radialGradient id="avocadoFlesh3D" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FCFDF5" />
      <stop offset="65%" stop-color="#E7F4E9" />
      <stop offset="100%" stop-color="#C5E3CA" />
    </radialGradient>
    <!-- Soft 3D Pit/Seed Gradient -->
    <radialGradient id="avocadoSeed3D" cx="34%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#A66E38" />
      <stop offset="55%" stop-color="#7B4B22" />
      <stop offset="100%" stop-color="#4A2B11" />
    </radialGradient>
    <!-- Floor Shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#174B35" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#174B35" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="100" cy="204" rx="52" ry="10" fill="url(#floorShadow)" />

  <!-- Cute Legs -->
  <path d="M80 176 C80 188, 76 195, 72 197 C68 199, 64 196, 66 191 C68 185, 72 178, 72 174 Z" fill="#174B35" />
  <path d="M120 176 C120 188, 124 195, 128 197 C132 199, 136 196, 134 191 C132 185, 128 178, 128 174 Z" fill="#174B35" />

  <!-- Cute Top Leaf Sprout -->
  <path d="M100 22 C102 10, 116 6, 122 14 C116 22, 106 24, 100 22 Z" fill="#48B273" stroke="#174B35" stroke-width="2" />

  <!-- Outer Avocado Body (Soft 3D Pear Shape) -->
  <path d="M100 22 C72 22, 56 54, 50 92 C43 136, 58 182, 100 182 C142 182, 157 136, 150 92 C144 54, 128 22, 100 22 Z" fill="url(#avocadoSkin3D)" />

  <!-- Inner Creamy Avocado Belly -->
  <path d="M100 34 C79 34, 66 60, 61 93 C55 130, 68 168, 100 168 C132 168, 145 130, 139 93 C134 60, 121 34, 100 34 Z" fill="url(#avocadoFlesh3D)" />

  <!-- Subtle 3D Rim Highlight -->
  <path d="M76 48 C68 65, 64 85, 63 105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55" />

  <!-- Expressive Eyes -->
  <g>
    <circle cx="82" cy="78" r="7.5" fill="#20352A" />
    <circle cx="79.5" cy="75.5" r="2.6" fill="#FFFFFF" />
    <circle cx="84.5" cy="80.5" r="1.1" fill="#FFFFFF" />

    <circle cx="118" cy="78" r="7.5" fill="#20352A" />
    <circle cx="115.5" cy="75.5" r="2.6" fill="#FFFFFF" />
    <circle cx="120.5" cy="80.5" r="1.1" fill="#FFFFFF" />
  </g>

  <!-- Warm Rosy Cheeks -->
  <ellipse cx="70" cy="87" rx="6" ry="3.5" fill="#F29B8E" opacity="0.55" />
  <ellipse cx="130" cy="87" rx="6" ry="3.5" fill="#F29B8E" opacity="0.55" />

  <!-- Cheerful Smile -->
  <path d="M91 86 Q100 95 109 86" stroke="#20352A" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Soft 3D Avocado Seed in Center Belly -->
  <ellipse cx="100" cy="130" rx="23" ry="25" fill="url(#avocadoSeed3D)" />
  <ellipse cx="92" cy="120" rx="7" ry="4.5" transform="rotate(-25 92 120)" fill="#D29B68" opacity="0.55" />

  <!-- Left Arm Resting & Right Arm Waving -->
  <path d="M52 104 C38 110, 34 124, 42 130" stroke="#174B35" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M148 98 C164 86, 170 68, 162 58" stroke="#174B35" stroke-width="5.5" stroke-linecap="round" fill="none" />
</svg>

